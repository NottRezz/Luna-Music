name: Deploy demo site to GitHub Pages

# This branch holds only the demo site, so a push to it is always a site change.
on:
  push:
    branches: [demo-site]
  workflow_dispatch:

# Pages needs id-token to mint its deployment credential; contents:read is the
# checkout. Nothing here writes to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. `cancel-in-progress: false` because cancelling a
# half-finished deploy is how you end up serving a partially uploaded site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
